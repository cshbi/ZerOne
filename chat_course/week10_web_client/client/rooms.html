<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>채팅 — 방 목록</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="header">
    <span>💬 방 목록 &nbsp;<small id="me"></small></span>
    <button class="refresh" onclick="refresh()">새로고침</button>
  </div>

  <div class="rooms-wrap">
    <div class="create-box">
      <input id="newRoom" type="text" placeholder="새 방 이름" onkeydown="if(event.key==='Enter')createRoom()" />
      <button onclick="createRoom()">방 만들기</button>
    </div>
    <ul class="room-list" id="list"></ul>
    <div class="empty" id="empty" style="display:none">아직 방이 없어요. 위에서 방을 만들어 보세요.</div>
  </div>

  <script src="codec.js"></script>
  <script src="messages.js"></script>
  <script src="app.js"></script>
  <script>
    // 닉네임을 한 번 물어보고 기억한다 (대화창으로도 넘겨 줌)
    let nick = sessionStorage.getItem("nick");
    if (!nick) { nick = (prompt("닉네임을 입력하세요") || "손님").trim() || "손님"; sessionStorage.setItem("nick", nick); }
    document.getElementById("me").textContent = "(" + nick + ")";

    const sock = new ChatSocket(nick);
    sock.onOpen = () => refresh();
    sock.onMessage = (m) => {
      // 방 목록 응답만 처리 (SYS 로 "방 목록: ..." 가 온다)
      if (m.kind === "sys" && m.text.startsWith("방 목록:")) renderRooms(m.text);
    };
    sock.connect();

    function refresh() { sock.command("/rooms"); }

    function createRoom() {
      const name = document.getElementById("newRoom").value.trim();
      if (!name) return;
      sock.command("/create " + name);
      document.getElementById("newRoom").value = "";
      setTimeout(refresh, 150);       // 만든 뒤 목록 갱신
    }

    // 방마다 창을 '하나만' 유지한다. 같은 방을 또 클릭하면 새로 열지 않고 그 창만 앞으로.
    // (창마다 새 연결 = 새 멤버라서, 안 그러면 혼자서도 인원이 계속 늘어난다)
    const openWindows = {};
    function openRoom(name) {
      const existing = openWindows[name];
      if (existing && !existing.closed) { existing.focus(); return; }   // 이미 열려 있으면 그 창만
      const url = `chat.html?nick=${encodeURIComponent(nick)}&room=${encodeURIComponent(name)}`;
      openWindows[name] = window.open(url, "chatroom_" + encodeURIComponent(name), "width=500,height=760");
    }

    // "방 목록: 잡담(2명), 게임(1명)"  ->  버튼 목록
    function renderRooms(text) {
      const body = text.slice("방 목록:".length).trim();
      const list = document.getElementById("list");
      const empty = document.getElementById("empty");
      list.innerHTML = "";
      if (body === "(없음)" || body === "") { empty.style.display = "block"; return; }
      empty.style.display = "none";
      body.split(", ").forEach((entry) => {
        const mt = entry.match(/^(.*)\((\d+)명\)$/);        // 이름 + 인원
        const name = mt ? mt[1] : entry;
        const count = mt ? mt[2] : "?";
        const li = document.createElement("li");
        li.innerHTML = `<span>🗨️ ${name}</span><span class="count">${count}명</span>`;
        li.onclick = () => openRoom(name);
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
